<header class="navbar">
    <div class="navbar__inner">
        <a class="navbar__brand" href="{% url 'core:home' %}">MercadoExpress</a>

        <form class="navbar__search" action="{% url 'catalog:list' %}" method="get">
            <input type="search" name="q" placeholder="Buscar productos..." value="{{ request.GET.q }}">
            <button type="submit">Buscar</button>
        </form>

        <nav class="navbar__links">
            <a href="{% url 'catalog:list' %}">Catálogo</a>
            <a class="navbar__cart" href="{% url 'cart:detail' %}">
                Carrito
                {% if cart %}<span class="badge">{{ cart|length }}</span>{% endif %}
            </a>
            {% if is_api_authenticated %}
                <a href="{% url 'dashboard:profile' %}">Mi perfil</a>
                <a href="{% url 'orders:list' %}">Mis pedidos</a>
                <a href="{% url 'accounts:logout' %}">Salir</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Ingresar</a>
                <a href="{% url 'accounts:register' %}">Crear cuenta</a>
            {% endif %}
        </nav>
    </div>
</header>

{% extends "base.html" %}

{% block main_class %}page page--console{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="console">
    <aside class="admin-panel__sidebar" aria-label="Panel de administración">
        <div class="admin-panel__group">General</div>
        <nav class="admin-panel__nav">
            <a class="admin-panel__nav-link{% if active_nav == 'home' %} is-active{% endif %}" href="{% url 'adminpanel:home' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
                Resumen
            </a>
            <a class="admin-panel__nav-link{% if active_nav == 'orders' %} is-active{% endif %}" href="{% url 'adminpanel:orders_list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8"/></svg>
                Pedidos
            </a>
            <a class="admin-panel__nav-link{% if active_nav == 'customers' %} is-active{% endif %}" href="{% url 'adminpanel:customers_list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 15c1.4.6 2.4 2.2 3 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Clientes
            </a>
        </nav>
        <div class="admin-panel__group">Catálogo</div>
        <nav class="admin-panel__nav">
            <a class="admin-panel__nav-link{% if active_nav == 'products' %} is-active{% endif %}" href="{% url 'catalog:admin_list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16l-1.4 10.3A2 2 0 0 1 16.6 19H7.4a2 2 0 0 1-2-1.7L4 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 7V6a3 3 0 0 1 6 0v1" stroke="currentColor" stroke-width="1.8"/></svg>
                Productos
            </a>
            <a class="admin-panel__nav-link{% if active_nav == 'categories' %} is-active{% endif %}" href="{% url 'adminpanel:categories_list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                Categorías
            </a>
            <a class="admin-panel__nav-link{% if active_nav == 'inventory' %} is-active{% endif %}" href="{% url 'adminpanel:inventory_list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7.5 12 12l8-4.5M12 12v9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                Inventario
            </a>
        </nav>
        <div class="admin-panel__foot">
            <a href="{% url 'catalog:list' %}">Ver tienda como cliente</a>
        </div>
    </aside>
    <div class="admin-panel__content">
        {% block panel_content %}{% endblock %}
    </div>
</div>
{% endblock %}

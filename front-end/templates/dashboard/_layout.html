{% extends "base.html" %}

{% block content %}
<div class="side-layout">
    <aside class="side-layout__sidebar">
        <nav class="side-layout__nav" aria-label="Mi cuenta">
            <a class="side-layout__nav-link{% if active_nav == 'profile' %} is-active{% endif %}" href="{% url 'dashboard:profile' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1.5-3.5 4.4-5 8-5s6.5 1.5 8 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Mis datos
            </a>
            <a class="side-layout__nav-link{% if active_nav == 'addresses' %} is-active{% endif %}" href="{% url 'dashboard:addresses' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
                Direcciones
            </a>
            <a class="side-layout__nav-link" href="{% url 'orders:list' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8"/></svg>
                Mis pedidos
            </a>
            <a class="side-layout__nav-link" href="{% url 'catalog:wishlist' %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C.8 8.1 2.3 4.5 6 4.5c2 0 3.4 1.1 4 2.2.6-1.1 2-2.2 4-2.2 3.7 0 5.2 3.6 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5Z" stroke="currentColor" stroke-width="1.8"/></svg>
                Favoritos
            </a>
        </nav>
    </aside>
    <div class="side-layout__content">
        {% block dashboard_content %}{% endblock %}
    </div>
</div>
{% endblock %}

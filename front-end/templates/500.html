<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor - MercadoExpress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Values copied from static/css/tokens.css: this page loads no static files. */
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 16px; font-family: "Figtree", "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.55; color: #17382a; background: #f3f8f2; -webkit-font-smoothing: antialiased; }
        .wrap { width: 100%; max-width: 560px; text-align: center; }
        .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 1.18rem; letter-spacing: -0.035em; }
        .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px 11px 11px 4px; background: #2e7d50; color: #c8e46e; }
        .canvas { padding: 40px 16px; margin-bottom: 22px; border: 1px solid #dae8dc; border-radius: 22px; background: repeating-linear-gradient(90deg, #e9f4ea 0 72px, #f3f8f2 72px 144px); }
        .code { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-variation-settings: "wdth" 75; font-size: clamp(5rem, 3.4rem + 6vw, 8rem); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; }
        .code span { color: #2e7d50; }
        h1 { margin: 0 0 8px; font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-variation-settings: "wdth" 82; font-size: clamp(1.5rem, 1.25rem + 1vw, 1.9rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.025em; }
        p { margin: 0; color: #4b6858; }
        .btn { display: inline-flex; align-items: center; min-height: 42px; margin-top: 20px; padding: 0 18px; border-radius: 8px; background: #2e7d50; color: #fff; font-weight: 600; font-size: 0.92rem; text-decoration: none; transition: background-color 0.15s ease; }
        .btn:focus-visible { outline: 2px solid #2e7d50; outline-offset: 2px; }
        @media (hover: hover) { .btn:hover { background: #22623e; } }
    </style>
</head>
<body>
    <!-- Deliberately standalone (no template inheritance, no context
         processors): a 500 means something in the app already broke, so
         this page must not depend on the DB, session, or backend API to
         render. NOTE: never type a percent-brace template tag delimiter
         pair inside this comment (open-brace-percent ... percent-close-
         brace) -- Django's template lexer scans for that sequence
         regardless of HTML comment syntax and will try to parse it as a
         real tag, crashing this exact page when a 500 happens. -->
    <div class="wrap">
        <div class="brand">
            <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16l-1.4 10.3A2 2 0 0 1 16.6 19H7.4a2 2 0 0 1-2-1.7L4 7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 7V6a3 3 0 0 1 6 0v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
            MercadoExpress
        </div>
        <div class="canvas" aria-hidden="true"><div class="code">5<span>0</span>0</div></div>
        <h1>Algo falló de nuestro lado</h1>
        <p>No es por algo que hayas hecho. Intenta de nuevo en unos minutos.</p>
        <a class="btn" href="/">Volver al inicio</a>
    </div>
</body>
</html>

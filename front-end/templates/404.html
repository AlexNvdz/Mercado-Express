{% extends "base.html" %}

{% block title %}Página no encontrada - MercadoExpress{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-page__canvas" aria-hidden="true">
        <div class="error-page__code">4<span>0</span>4</div>
    </div>
    <h1>No encontramos esta página</h1>
    <p class="muted">El enlace puede estar roto, o el producto o pedido ya no existe.</p>
    <div class="actions">
        <a class="btn" href="{% url 'core:home' %}">Ir al inicio</a>
        <a class="btn btn--secondary" href="{% url 'catalog:list' %}">Ver productos</a>
    </div>
</div>
{% endblock %}
